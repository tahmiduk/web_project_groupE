<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SoleHub - Home</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <a class="navbar-brand logo" href="index.html">SoleHub</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="products.html">Products</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="cart.html">Cart <span class="cart-counter">0</span></a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <div id="shoeCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="1500">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="images/slide1.jpg" class="d-block w-100 carousel-img" alt="Nike 1" />
        </div>
        <div class="carousel-item">
          <img src="images/slide2.jpg" class="d-block w-100 carousel-img" alt="New Balance" />
        </div>
        <div class="carousel-item">
          <img src="images/slide3.jpg" class="d-block w-100 carousel-img" alt="Blue Nike" />
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#shoeCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#shoeCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
      <div class="cookie-banner" id="cookieBanner">
        <p class="mb-2">We use cookies to improve your experience. You can manage your preferences below.</p>
        <div class="d-flex justify-content-center gap-2">
          <button id="acceptAll" class="btn btn-success btn-sm">Accept All</button>
          <button id="rejectAll" class="btn btn-danger btn-sm">Reject All</button>
          <button id="essentialOnly" class="btn btn-secondary btn-sm">Essential Only</button>
        </div>
      </div>

  <footer class="footer">
    <div class="container">
      <p>SoleHub © 2025</p>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/scripts.js"></script>
</body>
</html>
